# The customer's PyPI registry, stood in for by a caching reverse proxy of the public
# index. A Nexus or Artifactory "remote" PyPI repository is this same shape: it serves
# /simple/ and caches what it fetches from pypi.org.
#
# Only the INDEX is proxied. The wheel and sdist links inside it still point at PyPI's
# CDN (files.pythonhosted.org); the gate rewrites those to its own /_files/ path and
# relays the bytes itself, so artifact bytes are gated but do not pass through here.
# A registry that also mirrors the files is configured with FW_FILES_UPSTREAM.
#
# Verified 2026-09-13 against pypi.org before this file was committed: /simple/six/
# comes back with files.pythonhosted.org links intact, which is what the gate's
# rewrite keys on. Without proxy_set_header Accept-Encoding "" the index arrives
# gzipped and the link rewrite has nothing to match.

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=pypi:10m max_size=512m inactive=1d;

server {
  listen 8080;

  location /simple/ {
    proxy_pass https://pypi.org/simple/;
    proxy_ssl_server_name on;
    proxy_set_header Host pypi.org;
    proxy_set_header Accept-Encoding "";

    # pypi.org answers /simple/six with a 301 to /simple/six/. The gate's relay client
    # follows that itself (a plain http.Client, no CheckRedirect), so the rewrite here
    # only has to keep the followed hop on THIS host rather than sending the gate out
    # to pypi.org directly and around the cache.
    proxy_redirect https://pypi.org/ /;

    proxy_cache pypi;
    proxy_cache_valid 200 10m;
    add_header X-Cache $upstream_cache_status;
  }
}
