{{- if and (include "yellowjack.postgres.inUse" .) (not .Values.postgres.existingSecret) }}
{{- $name := include "yellowjack.postgres.name" . -}}
{{- /*
NO CREDENTIAL LIVES IN THE CHART (#22). The password is generated on first install and
then KEPT: `lookup` reads the Secret already in the cluster so an upgrade re-renders the
same value instead of rotating it under a running database. Under `helm template` there
is no cluster, lookup returns nothing, and a fresh random value is rendered -- which is
fine for a render and is why NOTES says never to apply a template's output by hand.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 32 -}}
{{- if $existing }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yellowjack.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Keep the Secret (and therefore the password the volume was initialised with)
    # across `helm uninstall`, so a reinstall against a surviving PVC still opens it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
