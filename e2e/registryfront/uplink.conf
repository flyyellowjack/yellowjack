# The ONLY route to the public registry in this rig. Both customer-registry stand-ins
# reach npm through here, so stopping this container cuts every path upstream at once —
# which is how e2e/registry_front.sh proves a pull was served from a local cache
# without having to instrument or trust a request counter.
#
# The resolver line is not decoration: nginx resolves proxy_pass hostnames at STARTUP
# when the target is a literal, and would then hold a stale address for the whole run.
# Assigning to a variable defers resolution to request time and forces the use of the
# Docker embedded DNS at 127.0.0.11.
resolver 127.0.0.11 valid=10s ipv6=off;
server {
  listen 80;
  location / {
    set $up "https://registry.npmjs.org";
    proxy_pass $up$request_uri;
    proxy_set_header Host registry.npmjs.org;
    proxy_ssl_server_name on;
  }
}
