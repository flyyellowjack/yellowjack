# Overlay upstream for the maven leg of e2e/verify_repo_local.sh.
#
# Why maven needs an overlay when npm/pypi are happy with a plain static server: the
# only way to route a real `mvn` through a plain-HTTP proxy is a settings.xml mirror
# with <mirrorOf>*</mirrorOf> (Maven 3.8.1+ blocks external:http:* otherwise), and that
# star ALSO captures maven's resolution of its own plugin tree (dependency-plugin,
# clean, install, deploy, site, …). Against a static tree with only our fixture in it,
# `mvn dependency:get` dies with "No plugin found for prefix 'dependency'" long before
# it ever asks for the artifact under test — a leg that "fails" for entirely the wrong
# reason and proves nothing.
#
# So: serve the crafted fixture if we have it, otherwise proxy to REAL Maven Central.
# The lie stays surgical (one POM + its maven-metadata.xml) and the rest of the world
# behaves normally.
server {
    listen 8000;

    # Crafted fixtures win.
    location / {
        root /srv;
        try_files $uri @central;
    }

    # Everything else: real Maven Central. The hostname goes through a variable so
    # nginx resolves it at request time via Docker's embedded DNS (a literal would be
    # resolved once at startup and pin the IP).
    location @central {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $central "repo.maven.apache.org";
        proxy_pass https://$central/maven2$uri;
        proxy_set_header Host repo.maven.apache.org;
        proxy_ssl_server_name on;
    }
}
